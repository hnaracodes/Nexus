# Builds the desktop app on all three platforms and attaches the results to
# a GitHub Release, on every `v*` tag push. This is phase 17e — see
# electron-builder.yml for the `publish:` block this reads, and
# apps/web/src/pages/Download.tsx / scripts/install.sh for the two consumers
# of what this workflow produces.
#
# Nothing here signs anything. The dmg/exe this produces are UNSIGNED and
# un-notarized (CLAUDE.md §11: that is a deferred decision, not an oversight)
# — the download page and install script both say so to the person receiving
# the file; this workflow's only job is to build it and get it onto a release.
#
# `npm run verify` runs in its own job and every build job depends on it, so
# nothing is published unless typecheck + both builds + both suites are
# green in THIS run — CLAUDE.md records a `tsc -b` failure shipping behind a
# green vitest run twice, the second time breaking a deploy. This closes
# that gap for a tagged release the same way verify.yml closes it for a push.
#
# WHY THE MATRIX DOES NOT PUBLISH (read before "simplifying" this back):
# An earlier version of this workflow had each matrix leg run
# `electron-builder --publish always`, relying on electron-builder's
# find-or-create-draft-release behaviour to let three concurrent OS jobs
# safely accumulate assets on one release. That is unsafe with the
# electron-builder version this repo pins (26.15.3 — verified by reading the
# installed package, not from memory):
#   - app-builder-lib's PublishManager caches one publisher per provider
#     config in a plain `Map` (`nameToPublisher`), populated with a
#     check-then-await-then-set that has no lock
#     (node_modules/app-builder-lib/out/publish/PublishManager.js,
#     `getOrCreatePublisher`).
#   - Each built artifact's `artifactCreated` event is handled as a
#     fire-and-forget task (`this.taskManager.addTask(...)`, not awaited by
#     the emitter — see `PublishManager`'s constructor and
#     `asyncEventEmitter.js`'s `emit`), so two artifacts finishing close
#     together run their publish-scheduling concurrently even though the
#     packager itself builds archs one at a time by default
#     (`packager.js` `doBuild`, `poolCount` defaults to 1).
#   - The macOS leg alone builds TWO targets in one `--publish always`
#     invocation (arm64 and x64 dmg — see electron-builder.yml's `mac.target`),
#     which is enough on its own to hit the race: both artifacts can see the
#     publisher cache miss before either finishes constructing a
#     `GitHubPublisher`, so two independent instances are created, each with
#     its own lazily-resolved release lookup
#     (node_modules/electron-publish/out/gitHubPublisher.js,
#     `getOrCreateRelease` / the `_release` Lazy). On a fresh tag — the only
#     time this workflow ever runs — neither publisher sees an existing
#     release, so both call `createRelease()` independently.
#   - Three separate OS jobs each running their own Node process compounds
#     this further: there is nothing here to make one job's release lookup
#     wait for another's.
# The reliable shape, used below instead: every matrix leg builds and
# uploads its artifacts as a plain CI artifact with `--publish never` (so
# electron-builder never talks to the GitHub Releases API at all), and a
# single `release` job — which `needs: build`, and therefore waits for every
# matrix leg to finish — creates the release and attaches everything exactly
# once. Nothing here can race because nothing runs concurrently against the
# GitHub Releases API.
#
# This workflow has not been run — it is unverified until a real `v*` tag
# is pushed and this pipeline executes for real. `actionlint` passes on it,
# and the race analysis above is grounded in reading the pinned package's
# own source, not in having exercised the pipeline.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Fails fast, before anything is built, if the tag is not a shape the rest of
  # this workflow can use.
  #
  # This is not hypothetical. The `v*` trigger above matches far more than
  # semver, and this repository already carries a tag named `v.1.0.0` — with a
  # dot after the v. The build job derives the package version as
  # `${GITHUB_REF_NAME#v}`, which turns that into `.1.0.0`, and `npm pkg set
  # version` rejects it. Without this gate the failure lands three jobs deep,
  # after `npm run verify` and two full platform builds have already run, with
  # an error about npm versions that says nothing about the tag that caused it.
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag is a version this workflow can build
        run: |
          tag="${GITHUB_REF_NAME}"
          case "${tag#v}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Tag '$tag' is not usable. Releases must be tagged vMAJOR.MINOR.PATCH — for example v1.0.0 (note: no dot after the v; this repo already has a 'v.1.0.0' tag that this workflow cannot build). The tag becomes the app version via \`npm pkg set version\`, so it has to be valid semver."
              exit 1
              ;;
          esac
          echo "Building release $tag (version ${tag#v})"

  verify:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # electron-builder auto-targets the host OS when given no platform
          # flag, but the flags are passed explicitly anyway so a reader does
          # not have to know that default to see what each job builds.
          - os: macos-latest
            flag: --mac
          - os: windows-latest
            flag: --win
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # electron-builder substitutes `${version}` (electron-builder.yml's
      # artifactName) from apps/desktop/package.json, so this needs to be the
      # tag that triggered this run, not whatever is committed.
      - name: Set the desktop package version from the pushed tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          (cd apps/desktop && npm pkg set version="$tag")

      # Builds the protocol package, the server, the web client (via
      # apps/desktop's own prebuild hook) and then apps/desktop/dist itself.
      - name: Build
        shell: bash
        run: npm run build -w @nexus/desktop

      # `--publish never`: this job only produces the dmg/exe/AppImage on
      # disk. It never talks to the GitHub Releases API, so it needs no
      # token and cannot race against the other two OS jobs or (on macOS)
      # against its own second architecture — see the header comment for why
      # that race is real with the pinned electron-builder version.
      - name: Package (no publish)
        shell: bash
        working-directory: apps/desktop
        run: npx electron-builder ${{ matrix.flag }} --publish never

      # electron-builder's own publish path also generates update-metadata
      # (*.yml/*.blockmap) — sha512, meant for a future electron-updater feed
      # this app does not have. scripts/install.sh and the download page
      # verify a plain "<hash>  <filename>" sha256 sidecar instead, so it is
      # generated here, once per artifact this job produced.
      - name: Checksum each artifact
        shell: bash
        working-directory: apps/desktop/release
        run: |
          shopt -s nullglob
          for f in *.dmg *.exe *.AppImage; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      # Hand the built files to the `release` job as a plain CI artifact.
      # Matrix legs never share a name (matrix.os differs), so this never
      # collides with actions/upload-artifact@v4's per-name overwrite rule.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.sha256
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.sha256
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.AppImage.sha256
          if-no-files-found: error

  # Runs once, after every matrix leg has uploaded its build (`needs: build`
  # on a matrixed job waits for the whole matrix), and is the ONLY step in
  # this workflow that ever talks to the GitHub Releases API. One process,
  # one release lookup, no concurrent sibling to race against.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download every platform's build output
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: desktop-*
          merge-multiple: true

      - name: Create the release (if it doesn't already exist) and attach everything
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "Unsigned, un-notarized build (CLAUDE.md §11 — signing is deferred, not skipped). See USING.md for the Gatekeeper/SmartScreen steps to run it."
          fi
          # --clobber makes this idempotent: re-running the workflow for a
          # tag whose release already exists (e.g. retrying after a partial
          # failure) re-uploads rather than erroring on an existing asset.
          gh release upload "$GITHUB_REF_NAME" ./* --clobber
