# fly.toml app configuration file generated for nexus-mvp on 2026-07-29T18:14:11-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nexus-mvp'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  # BOTH names, on purpose. `readEnv()` prefers SYNCODE_ and falls back to
  # NEXUS_, so the code is happy with either — but a deploy that fails and rolls
  # the IMAGE back while keeping the new CONFIG would leave a pre-rename server
  # reading only NEXUS_*, finding nothing, and falling back to a relative
  # ./data inside the container. It would boot clean and write the append-only
  # event log to a directory that vanishes on the next restart. Two lines to
  # make a partial rollback survivable.
  SYNCODE_DATA_DIR = '/data'
  NEXUS_DATA_DIR = '/data'
  PORT = '8080'
  SYNCODE_WORKDIR = '/data/work'
  NEXUS_WORKDIR = '/data/work'
  # The HOST is deliberately still nexus-mvp: every room link anyone holds
  # names it, and the link is the credential.
  SYNCODE_PUBLIC_URL = 'https://nexus-mvp.fly.dev'
  NEXUS_PUBLIC_URL = 'https://nexus-mvp.fly.dev'

[[mounts]]
  source = 'nexus_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
