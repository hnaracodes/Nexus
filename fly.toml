# fly.toml app configuration file generated for nexus-mvp on 2026-07-29T18:14:11-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nexus-mvp'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  NEXUS_DATA_DIR = '/data'
  PORT = '8080'

[[mounts]]
  source = 'nexus_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
