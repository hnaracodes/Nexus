# electron-builder config for @syncode/desktop.
#
# Nothing here downloads or packages anything until `npm run package` (i.e.
# `electron-builder` itself) is invoked — this file is inert on its own, and
# per the phase-9a scope that command was deliberately NOT run in this
# session (it pulls large platform-specific helper binaries on first use).
# This file exists so the packaging pipeline is provably wired up for all
# three targets, with signing left as an obvious blank rather than skipped
# silently — certificates are being obtained separately.

# Pinned, not ranged, and stated here as well as in package.json. Two reasons:
# electron-builder downloads platform binaries for one exact release, so a range
# is unresolvable; and in this npm workspace `electron` hoists to the REPO ROOT
# node_modules, where electron-builder does not look — so inferring the version
# from apps/desktop/node_modules fails even when electron is installed. Keep this
# in step with the `electron` devDependency in package.json.
electronVersion: 44.0.0

appId: dev.syncode.desktop
productName: SynCode
directories:
  output: release
# Uniform across all three platforms so the release workflow, the download
# page (apps/web/src/pages/Download.tsx) and scripts/install.sh can all find
# an asset by matching on this SHAPE — none of them hardcode a version, since
# `${version}` is substituted from package.json (or the CI-overridden version
# for a tagged release) at build time.
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
files:
  - dist/**/*
  - package.json
  # The join screen (phase 16a). It is plain HTML rather than a build artifact,
  # so `dist/**/*` does not cover it — and if it is missing from the bundle the
  # app opens to a blank window with no error, because `loadFile` on a missing
  # path fails silently in a packaged build. Verified present by launching the
  # packaged .app, not by reading this list.
  - join.html

mac:
  category: public.app-category.developer-tools
  # Both architectures, spelled out here rather than left to a CLI flag, so
  # that "release.yml builds arm64 + x64" is true by reading this file alone.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # electron-builder reads signing/notarization credentials from the
  # environment, not from this file, so nothing secret is committed here.
  # FILL IN once Apple Developer ID certificates exist, by setting:
  #   CSC_LINK                    — path or URL to the .p12 signing certificate
  #   CSC_KEY_PASSWORD            — that certificate's export password
  #   APPLE_ID                    — Apple ID used for notarization
  #   APPLE_APP_SPECIFIC_PASSWORD — an app-specific password for that Apple ID
  #   APPLE_TEAM_ID                — the Apple Developer Team ID
  # Until those are set, `electron-builder` still produces a .dmg — just an
  # UNSIGNED, un-notarized one: installable locally after a Gatekeeper
  # right-click-to-open, but not distributable to other Macs without one of
  # those warnings.
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - nsis
  # Same pattern as mac: read from the environment, filled in once a
  # certificate exists.
  #   CSC_LINK         — path or URL to the .pfx code-signing certificate
  #   CSC_KEY_PASSWORD — that certificate's password
  # Without them the NSIS installer is unsigned and Windows SmartScreen will
  # warn on first run.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Development
  # REQUIRED, and the Linux build cannot complete without it.
  #
  # `executableName` defaults to package.json's `name`, which in this workspace
  # is the npm scope `@syncode/desktop`. electron-builder strips the slash and
  # gets `@nexusdesktop`, which still contains `@`, and refuses:
  #
  #   ⨯ failed to build AppImage  error=executableName contains characters that
  #     cannot be safely used in file paths: @nexusdesktop
  #
  # macOS and Windows never hit this because they name the binary from
  # `productName` ("SynCode") instead; only Linux uses `executableName`, so the
  # first Linux build ever run is the first time anyone could have seen it.
  #
  # This is the THIRD place the npm scope has leaked into something a user sees:
  # `app.getName()` put rooms in `~/Library/Application Support/@syncode/desktop`
  # until `app.setName('SynCode')` fixed it (see main.ts), `productName` fixed the
  # bundle name, and this fixes the Linux executable. A scoped package name is
  # an npm implementation detail and every layer that derives an identity from
  # it has to be told otherwise, individually.
  #
  # Lowercase because it is a command people type and a path on disk; the
  # window and the menu bar still read "SynCode" from `productName`.
  executableName: syncode
  # AppImage has no code-signing step of its own — nothing to fill in here.
  #
  # It DOES ship with the stock Electron icon, because this project has no icon
  # asset. electron-builder warns and continues. Same on the other platforms;
  # a real icon is a design task nobody has done, not a packaging bug.

# GitHub as the nominal publish target — later, the feed an auto-updater
# would read for new versions. Phase 17e deliberately does NOT add
# `electron-updater`: CLAUDE.md §11 is explicit that an auto-updater is
# remote code execution by design, and it needs signing decided first.
#
# release.yml does NOT invoke electron-builder's own publish/upload path
# (`--publish never` throughout) — its header comment has the evidence, read
# from the pinned electron-builder version's own source, for why letting
# electron-builder's GitHub publisher run from three concurrent OS jobs (and,
# on macOS alone, two archs in one process) is a real race, not a
# hypothetical one. The actual release is created and every artifact
# attached exactly once, by a single serialized job, using `gh release`
# directly. This block stays only as the declared publish target/eventual
# auto-update feed shape; nothing in this build invocation uploads through it.
publish:
  provider: github
  owner: hnaracodes
  repo: SynCode
